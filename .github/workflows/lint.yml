#
# Static quality gates for the workflow templates. https://github.com/ernolf/ncmake-workflows
#
# The templates in workflows/ run in every app that installs them, so they are
# checked here before they ship: yamllint over the repository's YAML, actionlint
# over the templates and the repository's own workflows. REUSE licensing has its
# own workflow (reuse.yml, installed via the workflow manager).

name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install yamllint
        run: pipx install yamllint
      - name: Lint YAML
        run: yamllint .

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - name: Lint workflows (templates and own workflows)
        run: |
          "$(go env GOPATH)/bin/actionlint" -color \
            .github/workflows/*.yml workflows/*.yml
