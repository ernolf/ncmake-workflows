# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # The actions of the templates. With a directory other than "/", Dependabot
  # reads only the YAML files of that directory, so it never opens
  # .github/workflows: those workflows are managed by ncmake, and a change by
  # Dependabot would make ncmake flag them as locally modified. The apps receive
  # the updated templates through their workflow updater.
  - package-ecosystem: github-actions
    directory: "/workflows"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      actions:
        patterns:
          - "*"
